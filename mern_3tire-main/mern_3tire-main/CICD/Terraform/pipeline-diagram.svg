<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 680" font-family="Segoe UI, Roboto, Arial, sans-serif">

  <!-- White Background -->
  <rect width="1400" height="680" fill="#ffffff"/>

  <!-- ===================== DEVELOPER ===================== -->
  <rect x="30" y="128" width="76" height="54" rx="6" fill="none" stroke="#334155" stroke-width="3"/>
  <line x1="40" y1="138" x2="70" y2="138" stroke="#60a5fa" stroke-width="3"/>
  <line x1="40" y1="147" x2="96" y2="147" stroke="#cbd5e1" stroke-width="3"/>
  <line x1="40" y1="156" x2="86" y2="156" stroke="#cbd5e1" stroke-width="3"/>
  <line x1="40" y1="165" x2="62" y2="165" stroke="#60a5fa" stroke-width="3"/>
  <path d="M18 182 L118 182 L112 193 L24 193 Z" fill="none" stroke="#334155" stroke-width="3"/>
  <circle cx="68" cy="98" r="20" fill="none" stroke="#334155" stroke-width="3"/>
  <path d="M38 126 Q38 108 68 112 Q98 108 98 126" fill="none" stroke="#334155" stroke-width="3"/>
  <text x="68" y="222" text-anchor="middle" fill="#1e293b" font-size="18" font-weight="700">Developer</text>
  <text x="68" y="244" text-anchor="middle" fill="#64748b" font-size="14">git push</text>

  <!-- Arrow: Dev -> Git -->
  <line x1="124" y1="155" x2="178" y2="155" stroke="#334155" stroke-width="3" stroke-dasharray="10,6"/>
  <polygon points="183,155 171,147 171,163" fill="#334155"/>

  <!-- ===================== GIT SOURCE REPO ===================== -->
  <rect x="198" y="116" width="60" height="60" rx="8" fill="#F05032" transform="rotate(45,228,146)"/>
  <circle cx="218" cy="138" r="6" fill="#ffffff"/>
  <circle cx="240" cy="138" r="6" fill="#ffffff"/>
  <circle cx="229" cy="158" r="6" fill="#ffffff"/>
  <line x1="218" y1="144" x2="229" y2="153" stroke="#ffffff" stroke-width="3"/>
  <line x1="240" y1="144" x2="229" y2="153" stroke="#ffffff" stroke-width="3"/>
  <text x="229" y="202" text-anchor="middle" fill="#1e293b" font-size="18" font-weight="700">Source Repo</text>
  <text x="229" y="224" text-anchor="middle" fill="#64748b" font-size="14">GitHub</text>

  <!-- Arrow: Git -> Jenkins -->
  <text x="306" y="136" text-anchor="middle" fill="#64748b" font-size="14" font-style="italic">webhook</text>
  <line x1="272" y1="150" x2="346" y2="150" stroke="#334155" stroke-width="3" stroke-dasharray="10,6"/>
  <polygon points="351,150 339,142 339,158" fill="#334155"/>

  <!-- ===================== JENKINS PIPELINE ===================== -->
  <rect x="358" y="20" width="690" height="400" rx="16" fill="#ffffff" stroke="#475569" stroke-width="3"/>

  <!-- Jenkins butler -->
  <circle cx="404" cy="62" r="26" fill="#f8fafc" stroke="#D24939" stroke-width="3"/>
  <rect x="382" y="30" width="44" height="7" rx="3" fill="#1e293b"/>
  <path d="M386 37 L422 37 L419 30 L389 30 Z" fill="#1e293b"/>
  <circle cx="395" cy="56" r="3.5" fill="#334155"/>
  <circle cx="413" cy="56" r="3.5" fill="#334155"/>
  <path d="M392 67 Q404 75 416 67" fill="none" stroke="#334155" stroke-width="2"/>
  <rect x="424" y="58" width="14" height="18" rx="3" fill="#D24939"/>
  <path d="M438 62 Q447 62 447 67 Q447 72 438 72" fill="none" stroke="#D24939" stroke-width="2.5"/>
  <text x="460" y="60" fill="#1e293b" font-size="24" font-weight="700">Jenkins Pipeline</text>
  <text x="460" y="84" fill="#64748b" font-size="16">Declarative · IaC · Manual Approval Gate</text>

  <!-- ROW 1 -->
  <!-- Stage 1: Checkout -->
  <rect x="380" y="106" width="200" height="120" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2.5"/>
  <text x="480" y="132" text-anchor="middle" fill="#ea580c" font-size="15" font-weight="700">STAGE 1</text>
  <text x="480" y="162" text-anchor="middle" fill="#1e293b" font-size="22" font-weight="700">Checkout</text>
  <text x="480" y="188" text-anchor="middle" fill="#64748b" font-size="14">Git SCM · main branch</text>
  <text x="480" y="208" text-anchor="middle" fill="#64748b" font-size="14">GitHub webhook trigger</text>

  <line x1="582" y1="166" x2="608" y2="166" stroke="#94a3b8" stroke-width="3"/>
  <polygon points="613,166 603,158 603,174" fill="#94a3b8"/>

  <!-- Stage 2: TF Init -->
  <rect x="618" y="106" width="200" height="120" rx="12" fill="#faf5ff" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="718" y="132" text-anchor="middle" fill="#7c3aed" font-size="15" font-weight="700">STAGE 2</text>
  <text x="718" y="162" text-anchor="middle" fill="#1e293b" font-size="22" font-weight="700">TF Init</text>
  <text x="718" y="188" text-anchor="middle" fill="#64748b" font-size="14">Download providers</text>
  <text x="718" y="208" text-anchor="middle" fill="#64748b" font-size="14">AWS ~> 5.0 · -input=false</text>

  <line x1="820" y1="166" x2="846" y2="166" stroke="#94a3b8" stroke-width="3"/>
  <polygon points="851,166 841,158 841,174" fill="#94a3b8"/>

  <!-- Stage 3: Validate -->
  <rect x="856" y="106" width="180" height="120" rx="12" fill="#eff6ff" stroke="#3b82c4" stroke-width="2.5"/>
  <text x="946" y="132" text-anchor="middle" fill="#3b82c4" font-size="15" font-weight="700">STAGE 3</text>
  <text x="946" y="162" text-anchor="middle" fill="#1e293b" font-size="22" font-weight="700">Validate</text>
  <text x="946" y="188" text-anchor="middle" fill="#64748b" font-size="14">terraform validate</text>
  <text x="946" y="208" text-anchor="middle" fill="#64748b" font-size="14">fmt -check -recursive</text>

  <!-- Gate + row connector -->
  <rect x="870" y="230" width="68" height="22" rx="6" fill="#3b82c4"/>
  <text x="904" y="246" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">LINT</text>

  <line x1="946" y1="228" x2="946" y2="244" stroke="#94a3b8" stroke-width="3"/>
  <line x1="946" y1="244" x2="582" y2="244" stroke="#94a3b8" stroke-width="3"/>
  <line x1="582" y1="244" x2="582" y2="260" stroke="#94a3b8" stroke-width="3"/>
  <polygon points="582,265 574,255 590,255" fill="#94a3b8"/>

  <!-- ROW 2 -->
  <!-- Stage 4: TF Plan -->
  <rect x="380" y="268" width="200" height="120" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2.5"/>
  <text x="480" y="294" text-anchor="middle" fill="#d97706" font-size="15" font-weight="700">STAGE 4</text>
  <text x="480" y="324" text-anchor="middle" fill="#1e293b" font-size="22" font-weight="700">TF Plan</text>
  <text x="480" y="350" text-anchor="middle" fill="#64748b" font-size="14">-out=tfplan · -input=false</text>
  <text x="480" y="372" text-anchor="middle" fill="#64748b" font-size="14">Shows +create ~modify -destroy</text>

  <line x1="582" y1="328" x2="608" y2="328" stroke="#94a3b8" stroke-width="3"/>
  <polygon points="613,328 603,320 603,336" fill="#94a3b8"/>

  <!-- Stage 5: Manual Approval -->
  <rect x="618" y="268" width="200" height="120" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2.5"/>
  <text x="718" y="294" text-anchor="middle" fill="#dc2626" font-size="15" font-weight="700">STAGE 5</text>
  <text x="718" y="324" text-anchor="middle" fill="#1e293b" font-size="22" font-weight="700">Approval</text>
  <text x="718" y="350" text-anchor="middle" fill="#64748b" font-size="14">Human reviews plan output</text>
  <text x="718" y="372" text-anchor="middle" fill="#dc2626" font-size="14" font-weight="600">Click Apply or Abort</text>

  <line x1="820" y1="328" x2="846" y2="328" stroke="#94a3b8" stroke-width="3"/>
  <polygon points="851,328 841,320 841,336" fill="#94a3b8"/>

  <!-- Stage 6: TF Apply -->
  <rect x="856" y="268" width="180" height="120" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5"/>
  <text x="946" y="294" text-anchor="middle" fill="#16a34a" font-size="15" font-weight="700">STAGE 6</text>
  <text x="946" y="324" text-anchor="middle" fill="#1e293b" font-size="22" font-weight="700">TF Apply</text>
  <text x="946" y="350" text-anchor="middle" fill="#64748b" font-size="14">-auto-approve tfplan</text>
  <text x="946" y="372" text-anchor="middle" fill="#64748b" font-size="14">Creates real AWS resources</text>

  <!-- Gate badges -->
  <rect x="398" y="392" width="80" height="22" rx="6" fill="#d97706"/>
  <text x="438" y="408" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">PREVIEW</text>

  <rect x="638" y="392" width="80" height="22" rx="6" fill="#ef4444"/>
  <text x="678" y="408" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">GATE</text>

  <!-- Arrow: Jenkins -> AWS -->
  <line x1="1050" y1="220" x2="1090" y2="220" stroke="#334155" stroke-width="3" stroke-dasharray="10,6"/>
  <polygon points="1095,220 1083,212 1083,228" fill="#334155"/>

  <!-- ===================== AWS CLOUD ===================== -->
  <rect x="1102" y="30" width="270" height="390" rx="16" fill="#ffffff" stroke="#FF9900" stroke-width="3"/>

  <!-- AWS logo -->
  <rect x="1124" y="48" width="72" height="34" rx="8" fill="#232F3E"/>
  <text x="1160" y="72" text-anchor="middle" fill="#FF9900" font-size="18" font-weight="700">AWS</text>
  <text x="1212" y="62" fill="#1e293b" font-size="22" font-weight="700">Cloud</text>
  <text x="1212" y="84" fill="#64748b" font-size="15">us-east-1</text>

  <!-- ALB box -->
  <rect x="1120" y="100" width="236" height="56" rx="10" fill="#fff7ed" stroke="#FF9900" stroke-width="2"/>
  <text x="1238" y="126" text-anchor="middle" fill="#FF9900" font-size="18" font-weight="700">ALB (x2)</text>
  <text x="1238" y="146" text-anchor="middle" fill="#64748b" font-size="14">Frontend + Backend load balancers</text>

  <!-- Route53 box -->
  <rect x="1120" y="168" width="236" height="56" rx="10" fill="#eff6ff" stroke="#3b82c4" stroke-width="2"/>
  <text x="1238" y="194" text-anchor="middle" fill="#3b82c4" font-size="18" font-weight="700">Route53</text>
  <text x="1238" y="214" text-anchor="middle" fill="#64748b" font-size="14">DNS alias records (A type)</text>

  <!-- Security Group box -->
  <rect x="1120" y="236" width="236" height="56" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="1238" y="262" text-anchor="middle" fill="#dc2626" font-size="18" font-weight="700">Security Groups</text>
  <text x="1238" y="282" text-anchor="middle" fill="#64748b" font-size="14">ALB SG + Instance SG</text>

  <!-- Target Group box -->
  <rect x="1120" y="304" width="236" height="56" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="1238" y="330" text-anchor="middle" fill="#16a34a" font-size="18" font-weight="700">Target Groups</text>
  <text x="1238" y="350" text-anchor="middle" fill="#64748b" font-size="14">Frontend TG + Backend TG</text>

  <!-- Domain info -->
  <rect x="1120" y="372" width="236" height="36" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="1238" y="396" text-anchor="middle" fill="#475569" font-size="14">acadcart.com · backend.acadcart.com</text>

  <!-- ===================== BOTTOM ROW CARDS ===================== -->

  <!-- Terraform Modules Card -->
  <rect x="30" y="450" width="340" height="200" rx="16" fill="#ffffff" stroke="#7B42BC" stroke-width="2.5"/>
  <rect x="56" y="478" width="28" height="28" fill="#5C4EE5"/>
  <rect x="88" y="478" width="28" height="28" fill="#5C4EE5"/>
  <rect x="88" y="510" width="28" height="28" fill="#5C4EE5"/>
  <rect x="56" y="510" width="28" height="28" fill="#4040B2"/>
  <text x="136" y="496" fill="#7B42BC" font-size="20" font-weight="700">Terraform Modules</text>
  <text x="136" y="524" fill="#334155" font-size="16">ALB · Route53 · Security Groups</text>
  <text x="136" y="550" fill="#334155" font-size="16">Target Groups · Instance Attach</text>
  <text x="136" y="576" fill="#94a3b8" font-size="14">Modular IaC · State managed</text>
  <text x="136" y="600" fill="#94a3b8" font-size="14">Reusable across environments</text>
  <text x="56" y="636" fill="#64748b" font-size="13">terraform/ → modules/ → alb/ · target-group/ · security-group/ · route53/</text>

  <!-- AWS Credentials Card -->
  <rect x="400" y="450" width="310" height="200" rx="16" fill="#ffffff" stroke="#FF9900" stroke-width="2.5"/>
  <rect x="424" y="478" width="40" height="30" rx="6" fill="#FF9900"/>
  <text x="444" y="498" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">IAM</text>
  <text x="480" y="496" fill="#FF9900" font-size="20" font-weight="700">AWS Credentials</text>
  <text x="480" y="524" fill="#334155" font-size="16">AmazonWebServicesCredentials</text>
  <text x="480" y="550" fill="#334155" font-size="16">Binding via Jenkins plugin</text>
  <text x="480" y="576" fill="#334155" font-size="16">Injects AWS_ACCESS_KEY_ID</text>
  <text x="480" y="600" fill="#334155" font-size="16">+ AWS_SECRET_ACCESS_KEY</text>
  <text x="480" y="636" fill="#94a3b8" font-size="14">Credential ID: aws-credentials</text>

  <!-- Manual Approval Card -->
  <rect x="740" y="450" width="310" height="200" rx="16" fill="#ffffff" stroke="#dc2626" stroke-width="2.5"/>
  <circle cx="798" cy="520" r="34" fill="none" stroke="#dc2626" stroke-width="4"/>
  <rect x="788" y="500" width="20" height="40" rx="4" fill="none" stroke="#dc2626" stroke-width="3"/>
  <line x1="798" y1="508" x2="798" y2="520" stroke="#dc2626" stroke-width="3"/>
  <text x="848" y="496" fill="#dc2626" font-size="20" font-weight="700">Manual Approval</text>
  <text x="848" y="524" fill="#334155" font-size="16">Human reviews TF plan</text>
  <text x="848" y="550" fill="#334155" font-size="16">before any apply runs</text>
  <text x="848" y="576" fill="#334155" font-size="16">Safety net for production</text>
  <text x="848" y="600" fill="#94a3b8" font-size="14">input step · Apply or Abort</text>
  <text x="848" y="624" fill="#94a3b8" font-size="14">60m timeout auto-abort</text>

  <!-- Pipeline Options Card -->
  <rect x="1080" y="450" width="290" height="200" rx="16" fill="#ffffff" stroke="#c7d2fe" stroke-width="2.5"/>
  <circle cx="1128" cy="520" r="30" fill="none" stroke="#6366f1" stroke-width="3.5"/>
  <circle cx="1128" cy="520" r="12" fill="none" stroke="#6366f1" stroke-width="3"/>
  <line x1="1128" y1="487" x2="1128" y2="498" stroke="#6366f1" stroke-width="3.5"/>
  <line x1="1128" y1="542" x2="1128" y2="553" stroke="#6366f1" stroke-width="3.5"/>
  <line x1="1095" y1="520" x2="1106" y2="520" stroke="#6366f1" stroke-width="3.5"/>
  <line x1="1150" y1="520" x2="1161" y2="520" stroke="#6366f1" stroke-width="3.5"/>
  <text x="1178" y="496" fill="#6366f1" font-size="20" font-weight="700">Options</text>
  <text x="1178" y="524" fill="#334155" font-size="16">buildDiscarder (10)</text>
  <text x="1178" y="550" fill="#334155" font-size="16">timeout 60m</text>
  <text x="1178" y="576" fill="#334155" font-size="16">timestamps</text>
  <text x="1178" y="600" fill="#334155" font-size="16">disableConcurrent</text>
  <text x="1178" y="624" fill="#94a3b8" font-size="14">ansiColor(xterm)</text>

</svg>
