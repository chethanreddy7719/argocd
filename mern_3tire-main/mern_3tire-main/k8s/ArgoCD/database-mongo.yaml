apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mongodb
  namespace: argocd
spec:
  project: default
  source:
    chart: mongodb
    repoURL: https://github.com/jaintpharsha/mern_3tire.git  
    targetRevision: main  
    path: k8s/backend/mongo-chart
    helm:
      values: |
        replicaCount: 1
        storage:
          size: 4Gi
          className: ebs-mongo
  destination:
    server: https://kubernetes.default.svc
    namespace: database
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
